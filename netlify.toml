# Deploy no Netlify: frontend estático (PWA) + API como função serverless + cron como função agendada.
# Passo a passo e variáveis de ambiente: DEPLOY.md

[build]
  # As funções (netlify/functions) viram um arquivo único com todas as dependências em netlify/dist-functions:
  # o Netlify não embute node_modules em funções .mjs e o fastify quebra ao carregá-los soltos.
  # pg-native é o driver nativo opcional do `pg`; não é usado (carregado só sob demanda).
  command = "npm --prefix backend ci --omit=dev && npx --yes esbuild@0.25.10 netlify/functions/api.mjs netlify/functions/jobs.mjs --bundle --platform=node --format=esm --target=node22 --external:pg-native --out-extension:.js=.mjs --banner:js=\"import{createRequire as __cr}from'module';const require=__cr(import.meta.url);\" --outdir=netlify/dist-functions --log-level=warning && npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/dist-functions"

[build.environment]
  NODE_VERSION = "22"

# /api/* é atendido pela função netlify/functions/api.mjs, empacotada em netlify/dist-functions (avaliada antes dos redirects).
# Qualquer outra rota cai no app de página única.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Service worker e manifesto sempre revalidados (atualização do app sem cache velho)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
